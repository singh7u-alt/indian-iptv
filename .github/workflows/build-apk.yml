name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Indian-IPTV-App-2.2.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Restore Gradle wrapper & dependencies
        run: |
          flutter create --platforms=android .
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy APK as iptv-android-tv.apk
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/iptv-android-tv.apk

      - name: Upload Android TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-android-tv-apk
          path: Indian-IPTV-App-2.2.0/build/app/outputs/flutter-apk/iptv-android-tv.apk
